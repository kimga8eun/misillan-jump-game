<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>발아현미 타임어택 대작전!</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* 1. 상태 및 스타일 초기화: 캐릭터를 가두고 키울 영역 설정 */
        .char-container {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 50%;
            transition: transform 0.1s ease-out; /* 실시간 스케일업을 부드럽게 */
        }

        /* 3. 터치 시 찰진 손맛을 위한 탄성 애니메이션 효과 */
        .pop-effect {
            animation: pop 0.05s ease-in-out;
        }
        @keyframes pop {
            0% { transform: scale(var(--current-scale)); }
            50% { transform: scale(calc(var(--current-scale) * 1.05)); }
            100% { transform: scale(var(--current-scale)); }
        }
    </style>
</head>
<!-- 모바일 더블탭 줌 버그 방지를 위한 touch-manipulation 설정 -->
<body class="bg-gradient-to-br from-stone-50 to-amber-100 min-h-screen flex items-center justify-center p-4 font-sans select-none touch-manipulation">

    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl border border-amber-200 p-6 flex flex-col justify-between min-h-[580px] relative overflow-hidden">
        
        <!-- 타이머 및 터치 횟수 실시간 표시 (상태 모니터링) -->
        <div class="flex justify-between items-center bg-stone-50 p-3 rounded-2xl border border-stone-100">
            <div class="text-left">
                <span class="text-[10px] text-stone-400 font-bold block uppercase tracking-wider">제한 시간</span>
                <span id="timer" class="text-2xl font-black text-red-500">60.00초</span>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-stone-400 font-bold block uppercase tracking-wider">터치 횟수</span>
                <span class="text-2xl font-black text-emerald-600"><span id="score">0</span> / 150</span>
            </div>
        </div>

        <!-- 중앙 캐릭터 구역 (실시간으로 커지고 진화하는 공간) -->
        <div id="touch-zone" class="flex flex-col items-center justify-center my-6 cursor-pointer" onclick="handleTouch()">
            <div class="char-container bg-amber-50/60 shadow-inner border border-amber-100 relative">
                <img id="character" src="watermarked_img_14327949871261009267.png" alt="발아현미 캐릭터" class="object-contain max-h-full">
            </div>
            <p id="hint-text" class="text-xs text-amber-600 font-black animate-pulse mt-4">🔥 화면을 마구 연타하세요! 🔥</p>
        </div>

        <!-- 하단 컨트롤 영역 및 상태창 -->
        <div class="bg-stone-900 text-white rounded-2xl p-4 text-center shadow-lg relative z-10">
            <div id="stage-name" class="text-sm font-black text-amber-400">1단계: 엄선된 통현미</div>
            <div id="stage-desc" class="text-xs text-stone-300 mt-1">누르면 시작합니다! 준비하세요!</div>
            
            <!-- 누르면 시작하는 스타트 버튼 -->
            <button id="start-btn" onclick="startGame(event)" class="w-full bg-gradient-to-r from-amber-500 to-emerald-600 text-white font-extrabold py-3 px-4 rounded-xl mt-3 shadow-md hover:opacity-90 transition cursor-pointer">
                게임 시작하기 🚀
            </button>
        </div>

        <!-- 최종 전환 화면 오버레이 -->
        <div id="overlay" class="absolute inset-0 bg-stone-900/95 flex flex-col items-center justify-center text-white p-6 hidden z-50">
            <h2 id="overlay-title" class="text-3xl font-black mb-2 text-amber-400">🎉 발아 대성공! 🎉</h2>
            <p id="overlay-desc" class="text-sm text-stone-300 text-center mb-6">가바(GABA)와 영양이 최고조에 달했습니다!<br>잠시 후 구매 페이지로 이동합니다...</p>
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber-400"></div>
        </div>
    </div>

    <script>
        // 최종 전환될 구매 링크 주소
        const BUY_URL = "https://your-shop-link.com/products/germinated-brown-rice"; 

        // 각 구간별 이미지 포지션 및 텍스트 설정 (150타 기준)
        const stages = [
            { name: "1단계: 엄선된 통현미 🌾", desc: "단단한 통현미 상태입니다. 더 빠르게두드리세요!", pos: "0% center" },
            { name: "2단계: 깨끗한 물 투과 💧", desc: "세포들이 잠에서 깨어 물을 머금기 시작합니다!", pos: "25% center" },
            { name: "3단계: 0.5mm 싹이 트다! 🌱", desc: "현미의 눈에서 건강한 싹이 움트기 시작합니다!", pos: "50% center" },
            { name: "4단계: 가바(GABA) 대폭발 🔥", desc: "식이섬유와 가바 영양소가 폭발적으로 늘어납니다!", pos: "75% center" },
            { name: "5단계: 영양 가득 발아현미 🥣", desc: "성공! 부드럽고 완벽한 발아현미가 완성되었습니다!", pos: "100% center" }
        ];

        // 1. 상태 데이터 정의
        let touchCount = 0;
        let timeLeft = 60.00;
        let timerInterval = null;
        let isPlaying = false;
        const maxTouches = 150; // 최종 한계점 설정

        const charImg = document.getElementById('character');
        const container = document.querySelector('.char-container');

        // 기본 이미지 크기 및 스프라이트 배치 세팅
        window.onload = function() {
            charImg.style.objectFit = "cover";
            charImg.style.objectPosition = stages[0].pos;
            charImg.style.width = "500% auto";
            container.style.setProperty('--current-scale', 0.8);
            container.style.transform = "scale(0.8)";
        };

        // 2. 고정밀 타이머 시스템 루프 (누르면 시작)
        function startGame(e) {
            // 이벤트 버블링 차단: 시작 버튼 클릭이 터치 카운트에 들어가지 않도록 방지
            e.stopPropagation(); 
            
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('stage-desc').innerText = "제한 시간 안에 발아를 완료하세요!";
            isPlaying = true;
            
            // 0.01초(10ms) 단위로 줄어드는 긴박한 루프 구동
            timerInterval = setInterval(() => {
                timeLeft -= 0.01;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame(false);
                }
                document.getElementById('timer').innerText = timeLeft.toFixed(2) + '초';
            }, 10);
        }

        // 3. 인터랙티브 터치 & 실시간 스케일업 로직
        function handleTouch() {
            if (!isPlaying) return;

            touchCount++;
            document.getElementById('score').innerText = touchCount;

            // 터치할 때마다 물리적으로 크기를 실시간 누적 스케일업 공식 적용
            // 기본 0.8 크기에서 시작해 터치할 때마다 0.004씩 무한히 커짐
            let currentScale = 0.8 + (touchCount * 0.004); 
            container.style.setProperty('--current-scale', currentScale);
            container.style.transform = `scale(${currentScale})`;

            // 찰진 손맛 애니메이션 트리거
            container.classList.remove('pop-effect');
            void container.offsetWidth; // 브라우저 리플로우 강제 유도하여 애니메이션 리셋
            container.classList.add('pop-effect');

            // 터치 횟수 구간에 맞춰 진화 캐릭터 비주얼 스위칭 (150타 나누기 4단계)
            let stageIdx = Math.min(Math.floor(touchCount / 38), stages.length - 1);
            if (touchCount === maxTouches) stageIdx = 4;

            const stage = stages[stageIdx];
            document.getElementById('stage-name').innerText = stage.name;
            document.getElementById('stage-desc').innerText = stage.desc;
            charImg.style.objectPosition = stage.pos;

            // 4. 한계점 도달 시 게임 종료 루틴 작동
            if (touchCount >= maxTouches) {
                endGame(true);
            }
        }

        // 4. 한계점 도달 후 최종 화면 전환
        function endGame(isSuccess) {
            isPlaying = false;
            clearInterval(timerInterval); // 타이머 루프 즉시 정지

            const overlay = document.getElementById('overlay');
            const title = document.getElementById('overlay-title');
            const desc = document.getElementById('overlay-desc');

            overlay.classList.remove('hidden');

            if (isSuccess) {
                title.innerText = "🎉 발아 대성공! 🎉";
                desc.innerHTML = "가바(GABA)와 영양이 최고조에 달했습니다!<br>0.5초 후 발아현미 상점으로 자동 이동합니다.";
                
                // 안내 문구를 보여준 뒤 0.5초(500ms) 후에 최종 구매 링크로 주소 변경
                setTimeout(() => {
                    window.location.href = BUY_URL;
                }, 500);
            } else {
                title.innerText = "😢 발아 실패 😢";
                title.className = "text-3xl font-black text-red-500 mb-2";
                desc.innerHTML = "수분이 부족해 발아가 멈췄습니다.<br>다시 건강한 싹을 틔워보세요!";
                
                const retryBtn = document.createElement('button');
                retryBtn.innerText = "다시 시도하기 🔄";
                retryBtn.className = "mt-4 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-6 rounded-xl text-sm transition cursor-pointer";
                retryBtn.onclick = () => location.reload();
                overlay.appendChild(retryBtn);
            }
        }
    </script>
</body>
</html>
